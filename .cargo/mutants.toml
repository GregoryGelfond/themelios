    # facets.len()`; replacing the second `<` with `<=` admits the
    # fully resolved case into a walk that emits only the missing
    # facets — of which it has none — so the mutant is observationally
    # identical to the code and no test can distinguish it. Pinned to
    # the printed description; if the site moves, it resurfaces at the
    # next audit and is re-pinned there.
    "source\\.rs:316:37: replace < with <= in check_sources_laws",
]
