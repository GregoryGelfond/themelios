# the len > MAX_LEN comparison, reachable only with a text over four
# gibibytes) was retired before the audit: both admission doors share
# Source::admit_len, whose boundary is held at MAX_LEN and MAX_LEN + 1
# without an allocation, so its mutants are expected to be caught.
exclude_re = [
