name: checks
on:
  push:
  pull_request:

# The checks read the repository and write nothing back, so the workflow
# token is read-only: a compromised action can do no more than read
# (docs/specification.md §12.4, supply-chain provenance).
permissions:
  contents: read

# The toolchain the checks pin, named once and referenced at every rustup
# call. The pin is reproducibility and matches the floor
# (docs/specification.md §10.1); rust-version = "1.97" in Cargo.toml is the
# floor, and this pin is at or above it.
env:
  RUST_TOOLCHAIN: "1.97.1"

jobs:
  gate:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Necessary: the checks build from the repository contents, and this
      # is the first-party action for that. Pinned to a commit for
      # reproducible provenance, never a movable tag (§10.1, §12.4).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal \
            --component rustfmt,clippy
          rustup default "$RUST_TOOLCHAIN"
      - run: cargo fmt --all --check
      # --locked: the committed Cargo.lock is certified, never re-resolved.
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Not memory-capped here. docs/specification.md §5.2/§10.2 commit a
      # memory-capped run "where the platform allows" against the work-list
      # memory bomb; at this tier that boundary is held by construction —
      # every walk is iterative or grammar-bounded and tree depth is bounded
      # (docs/design/syntax.md §5.4 law 3, §6.6), the fuzz would surface an
      # OOM, and §16's stage-2 instrument list names no capping instrument.
      # The cap's locus is the out-of-band fuzz under a cgroup limit; it is
      # base.md's workspace-CI commitment, carried there.
      - run: cargo test --workspace --locked
      # The witnesses this tier seeds (docs/design/syntax.md §16): executed,
      # not merely compiled (docs/specification.md §10.1).
      - run: |
          for example in comments_as_data diagnostics_quality hostile_input asp_core_2; do
            cargo run -p themelios-syntax --example "$example" --locked
          done
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal \
            --component llvm-tools
          rustup default "$RUST_TOOLCHAIN"
      # Necessary: installs the cargo-llvm-cov binary the coverage floor
      # measures with; hand-installing it is more moving parts than the
      # pinned action. The action is pinned to a commit, and the tool to
      # an exact version, so neither floats (§10.1, §12.4).
      - uses: taiki-e/install-action@51c9d223e46ef0189fd65bfe00a28e0de249282c # cargo-llvm-cov
        with:
          tool: cargo-llvm-cov@0.8.7
      # The floor is a per-change tripwire for the wholly untested
      # module, never a target: raising it is not a goal, gaming it
      # is a defect, and mutation remains the auditor of whether the
      # tests ask anything (docs/specification.md §10.1). Re-derived after
      # the typed-AST accessor tests the mutation audit prompted: measured
      # line coverage (95.21%) rounded
      # down to a multiple of five, minus five — slack that absorbs
      # toolchain and coverage-tool measurement drift. One number on
      # every machine.
      - run: cargo llvm-cov --workspace --exclude themelios-syntax-fuzz --locked --fail-under-lines 90
