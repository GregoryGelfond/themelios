[package]
name = "themelios-query"
version = "0.1.0"
description = "The epistemic reading over the program tier's patterns and the solve tier's outcomes: the three-valued answer, the world view, cautious and brave consequence, and bindings — engine-free."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# The shipped closure: the solve tier and, beneath it, the lower tiers and
# syntax's own closure — no dependency of this crate's own beyond them
# (docs/design/query.md; docs/design/solve.md §16; docs/specification.md §12.3,
# §12.5). The solve tier's tests/trust.rs holds the closure over Cargo's
# resolved graph.
[dependencies]
themelios-base = { path = "../themelios-base" }
themelios-program = { path = "../themelios-program" }
themelios-solve = { path = "../themelios-solve" }

[features]
# The whole-value proofs on very deep and large fixtures: the in-suite scaling
# proofs (src/lib.rs) that hold the deep-symbol match to near-linear cost, and the
# depth proof (tests/query_depth.rs) that walks a deeply nested query on a small
# stack. On by default so the ordinary test and coverage runs check them; held out
# of the mutation loop with `--no-default-features`, as the program tier does.
scale-proofs = []
default = ["scale-proofs"]

# The stage instruments, outside the shipped closure's claim: proptest and
# criterion as in the tiers beneath; trybuild for the compile-fail witness that
# the borrow checker serialises a world view's overlapping reads
# (docs/design/query.md §2.3); and the syntax tier solely so
# tests/cross_prelude.rs can glob its prelude beside this one.
[dev-dependencies]
proptest = "1"
criterion = "0.7"
trybuild = "1"
themelios-syntax = { path = "../themelios-syntax" }

[lints]
workspace = true

[[bench]]
name = "matching"
harness = false
