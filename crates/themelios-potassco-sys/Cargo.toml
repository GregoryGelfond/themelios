[package]
name = "themelios-potassco-sys"
version = "0.1.0"
description = "Reserved, not yet implemented: the pinned bindings over the libclingo and libclingcon C APIs, against clingo 5.8.2, the authority to be vendored — the binding half of the potassco trusted computing base. Feature-gated; never in a default build."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# Reserves the `clingo` link name, so that no second package in a build can link
# libclingo (docs/design/solve.md §11.1, §11.3); how libclingcon's link sits
# beside it is designed with the adapter.
links = "clingo"

# Nothing: the bindings, once they land, stand on the C ABI alone.
[dependencies]

# bindgen will regenerate the vendored bindings from the libclingo and
# libclingcon C headers — an
# out-of-band act behind the `bindgen` feature, so a default build never
# compiles or runs it (docs/design/solve.md §2.1, §16). Not yet wired: the build
# script does nothing.
[build-dependencies]
bindgen = { version = "0.73", optional = true }

[features]
# The binding proper, once it lands: the vendored bindings and the link against
# the pinned clingo 5.8.2 built from the vendored source (libclingcon's is
# designed with the adapter). Today it enables
# nothing, and the crate is an empty shell that links nothing under every
# feature. Off by default, so a default workspace build stays FFI-free
# (docs/design/solve.md §2.1, §11.3, §16). Reached through themelios-potassco's
# `potassco` feature.
clingo = []
# Regenerating the vendored bindings over the libclingo and libclingcon C
# headers with bindgen, once wired: out-of-band, never in a default build
# (docs/design/solve.md §2.1, §16).
bindgen = ["dep:bindgen"]

# The workspace lint tables restated — `[lints] workspace = true` admits no
# per-lint departure beside it — with the one departure the trusted computing
# base carries: unsafe is allowed here and in themelios-potassco, and nowhere
# else (docs/design/solve.md §2.1, §16). Every other line, and the argument for
# each clippy allowance, is the workspace's own (the root Cargo.toml).
[lints.rust]
unsafe_code = "allow"
missing_docs = "deny"
unused = { level = "deny", priority = -1 }
unused_must_use = "deny"
dead_code = "deny"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
cast_possible_truncation = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
large_enum_variant = "allow"
